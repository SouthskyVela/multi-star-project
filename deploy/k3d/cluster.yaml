apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: multi-star-sim
servers: 1
agents: 3
image: rancher/k3s:v1.37.2-k3s1
subnet: "172.45.0.0/16"
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6443"
registries:
  create:
    name: registry.localhost
    host: "127.0.0.1"
    hostPort: "5001"
  config: |
    mirrors:
      docker.io:
        endpoint:
          - https://docker.m.daocloud.io
        rewrite: {}
      registry.localhost:5000:
        endpoint:
          - http://registry.localhost:5000
        rewrite: {}
      registry.localhost:5001:
        endpoint:
          - http://registry.localhost:5000
        rewrite: {}
    configs: {}
    auths: {}
options:
  k3d:
    wait: true
    timeout: "180s"
    disableLoadbalancer: false
    disableImageVolume: false
    disableRollback: false
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
    nodeLabels:
      - label: multi-star.io/node-role=infrastructure
        nodeFilters:
          - server:*
      - label: multi-star.io/failure-domain=main-a
        nodeFilters:
          - agent:0
      - label: multi-star.io/failure-domain=main-b
        nodeFilters:
          - agent:1
      - label: multi-star.io/failure-domain=main-c
        nodeFilters:
          - agent:2
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
