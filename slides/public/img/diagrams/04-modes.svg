<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6776"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="#ffffff"/>
<text x="60" y="62" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">运行模式与任务流程</text><text x="60" y="94" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">三种模式共享同一套计划版本与命令通道，切换必须先通过前置校验</text>
<rect x="120" y="240" width="300" height="130" rx="16" ry="16" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="270" y="285" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">SURVEY</text>
<text x="270" y="318" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">巡天：按健康小星维持阵列</text>
<text x="270" y="344" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">持续生成观测与上传任务</text>
<rect x="640" y="240" width="300" height="130" rx="16" ry="16" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.6"/>
<text x="790" y="285" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">FIXED_SOURCE</text>
<text x="790" y="318" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">定源：锁定单个天文事件</text>
<text x="790" y="344" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">事件到期自动回退 SURVEY</text>
<rect x="1160" y="240" width="300" height="130" rx="16" ry="16" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.6"/>
<text x="1310" y="285" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">CALIBRATION</text>
<text x="1310" y="318" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">标定：验证复增益与相位</text>
<text x="1310" y="344" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">不产生科学观测计划</text>
<line x1="420" y1="288" x2="636" y2="288" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="528" y="272" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle" opacity="1.0">event accepted</text>
<line x1="636" y1="330" x2="420" y2="330" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
<text x="528" y="352" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#b45309" font-weight="normal" text-anchor="middle" opacity="1.0">事件到期 / 无有效事件</text>
<line x1="940" y1="300" x2="1156" y2="300" stroke="#5b6776" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1048" y="284" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">手动切换</text>
<line x1="1156" y1="332" x2="940" y2="332" stroke="#5b6776" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1048" y="354" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">手动切回</text>
<line x1="180" y1="378" x2="180" y2="470" stroke="#5b6776" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="192" y="430" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">前置校验</text>
<text x="200" y="490" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">• 健康小星 ≥ 2</text>
<text x="200" y="516" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">• 没有 UNKNOWN 在途任务</text>
<text x="200" y="542" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">• FIXED_SOURCE 需要未过期事件</text>
<text x="200" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">• 切换生成新的 plan_version</text>
<rect x="760" y="470" width="700" height="250" rx="12" ry="12" fill="#f1f5f9" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="780" y="502" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">单次计划内的任务编排</text>
<rect x="790" y="530" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="850" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="middle" opacity="1.0">生成目标构型</text>
<line x1="912" y1="558" x2="922" y2="558" stroke="#5b6776" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="925" y="530" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="985" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="middle" opacity="1.0">下发 transfer</text>
<line x1="1047" y1="558" x2="1057" y2="558" stroke="#5b6776" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="1060" y="530" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="1120" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="middle" opacity="1.0">执行 observation</text>
<line x1="1182" y1="558" x2="1192" y2="558" stroke="#5b6776" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="1195" y="530" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="1255" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="middle" opacity="1.0">分块 upload</text>
<line x1="1317" y1="558" x2="1327" y2="558" stroke="#5b6776" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="1330" y="530" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="1390" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="middle" opacity="1.0">verify 归档</text>
<text x="780" y="620" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">每个任务带 plan_version 与 expires_at；超时未执行则作废，不阻塞下一版计划。</text>
<text x="780" y="650" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">故障时只重构受影响小星，其余任务保持；恢复后重新纳入阵列。</text>
</svg>
