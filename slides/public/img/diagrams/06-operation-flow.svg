<text x="136" y="234" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">① 打开面板</text>
<text x="136" y="262" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">浏览器访问 18082，1 s 轮询快照</text>
