<text x="616" y="638" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">健康数 / UNKNOWN / epoch</text>
<line x1="432" y1="620" x2="596" y2="620" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="470" y="606" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="start" opacity="1.0">是</text>
<rect x="960" y="580" width="280" height="80" rx="10" ry="10" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="976" y="612" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">⑥ 下发命令</text>
<text x="976" y="638" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">command_id + epoch + expires_at</text>
<line x1="902" y1="620" x2="956" y2="620" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
<rect x="1300" y="580" width="250" height="80" rx="10" ry="10" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="1316" y="612" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">⑦ 快照刷新</text>
<text x="1316" y="638" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">面板 1 s / Headlamp 4 s</text>
<line x1="1242" y1="620" x2="1296" y2="620" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
<rect x="1300" y="380" width="250" height="80" rx="10" ry="10" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="1316" y="412" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">⑧ 反馈与审计</text>
<text x="1316" y="438" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">状态区 + 事件流 + 日志</text>
<line x1="1425" y1="578" x2="1425" y2="464" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
<rect x="600" y="760" width="950" height="90" rx="10" ry="10" fill="#f1f5f9" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="618" y="792" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">一致性保证</text>
<text x="618" y="818" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">同一 command_id 只生效一次；epoch 低于本地最高值直接拒绝；计划版本只增不减；不可逆变轨不重发。</text>
</svg>
