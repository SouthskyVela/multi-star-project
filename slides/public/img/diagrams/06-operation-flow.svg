<text x="136" y="382" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">主星或 small-sat-0 … 8</text>
<rect x="120" y="440" width="420" height="86" rx="10" ry="10" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="136" y="474" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">③ 选择操作</text>
<text x="136" y="502" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">暂停主控 / 注入 / 恢复 / 提交事件 / 切模式</text>
