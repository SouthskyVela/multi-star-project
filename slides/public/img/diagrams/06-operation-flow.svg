  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="62" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">系统操作流：从用户点击到状态回读</text><text x="60" y="94" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">破坏性操作在页面内二次确认，窗口 15 s；请求经主控校验后下发</text>
