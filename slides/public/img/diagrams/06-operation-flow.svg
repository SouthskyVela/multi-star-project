<line x1="330" y1="406" x2="330" y2="438" stroke="#5b6776" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="330,565 480,620 330,675 180,620" fill="#fdf1e3" stroke="#b45309" stroke-width="1.8"/><text x="330" y="626" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">④ 二次确认？</text>
