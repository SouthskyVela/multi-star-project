<path d="M180,620 L90,620 L90,483" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="96" y="600" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" fill="#b45309" font-weight="normal" text-anchor="start" opacity="1.0">超时 15 s / 再点取消</text>
<rect x="600" y="580" width="300" height="80" rx="10" ry="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.6"/>
