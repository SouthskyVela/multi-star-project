<text x="904" y="626" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">1 个 Pod（可滚动更新）</text>
<text x="218" y="700" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">Pod = 最小调度单元（一个或多个容器）；Node = 承载 Pod 的虚拟主机，也就是上面的 server / agent 容器。</text>
<text x="218" y="726" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">同一 Pod 内的容器共享网络命名空间；每个小星、主星各自一个 Pod，并挂载独立 PVC 保存状态。</text>
