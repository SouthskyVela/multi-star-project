<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6776"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="#ffffff"/>
<text x="60" y="62" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" fill="#1f2937" font-weight="bold" text-anchor="start" opacity="1.0">调度时序：主控竞选、命令围栏与接管</text><text x="60" y="94" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">同一条命令只在特定 epoch 与 plan 版本内有效，旧主控恢复后无法重新生效</text>
<rect x="80" y="130" width="180" height="52" rx="10" ry="10" fill="#e6f4f1" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="170" y="163" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">main-sat-0</text>
<line x1="170" y1="182" x2="170" y2="820" stroke="#b9c3ce" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="470" y="130" width="180" height="52" rx="10" ry="10" fill="#e6f4f1" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="560" y="163" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">main-sat-1</text>
<line x1="560" y1="182" x2="560" y2="820" stroke="#b9c3ce" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="860" y="130" width="180" height="52" rx="10" ry="10" fill="#e6f4f1" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="950" y="163" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">main-sat-2</text>
<line x1="950" y1="182" x2="950" y2="820" stroke="#b9c3ce" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="1150" y="130" width="180" height="52" rx="10" ry="10" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="1240" y="163" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">Lease</text>
<line x1="1240" y1="182" x2="1240" y2="820" stroke="#b9c3ce" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="1380" y="130" width="180" height="52" rx="10" ry="10" fill="#ffffff" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="1470" y="163" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle" opacity="1.0">small-sat-*</text>
<line x1="1470" y1="182" x2="1470" y2="820" stroke="#b9c3ce" stroke-width="1.2" stroke-dasharray="5 5"/>
<line x1="176" y1="220" x2="1234" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="705.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle" opacity="1.0">① 申请 / 续约 Lease</text>
<line x1="1234" y1="270" x2="176" y2="270" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="705.0" y="260" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle" opacity="1.0">② 授予 epoch 17</text>
<line x1="176" y1="330" x2="1464" y2="330" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="820.0" y="320" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle" opacity="1.0">③ 下发命令（epoch/plan/command_id）</text>
<line x1="1464" y1="390" x2="176" y2="390" stroke="#5b6776" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="380" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">④ 回执：accepted / verified</text>
<line x1="1234" y1="520" x2="566" y2="520" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="900.0" y="510" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle" opacity="1.0">⑥ 租约过期，main-sat-1 接管</text>
<line x1="566" y1="580" x2="1464" y2="580" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="1015.0" y="570" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle" opacity="1.0">⑦ 新计划 plan + 1，重新下发</text>
<line x1="176" y1="640" x2="1464" y2="640" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="630" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#b45309" font-weight="normal" text-anchor="middle" opacity="1.0">⑧ 旧主恢复：epoch 16 命令被拒绝</text>
<line x1="1464" y1="700" x2="176" y2="700" stroke="#5b6776" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="690" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="middle" opacity="1.0">⑨ 仅接受 epoch 17 命令</text>
<rect x="164" y="440" width="12" height="86" fill="#b45309" opacity="0.25" rx="6"/>
<text x="186" y="478" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#b45309" font-weight="normal" text-anchor="start" opacity="1.0">⑤ 主控暂停 22 s</text>
<text x="186" y="500" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#b45309" font-weight="normal" text-anchor="start" opacity="1.0">停止续约、停止下发</text>
<rect x="120" y="760" width="1360" height="60" rx="10" ry="10" fill="#f1f5f9" stroke="#b9c3ce" stroke-width="1.5"/>
<text x="140" y="796" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5b6776" font-weight="normal" text-anchor="start" opacity="1.0">幂等保证：command_id 去重；epoch 围栏拒绝旧主控；plan_version 只增不减；UNKNOWN 任务不重发不可逆变轨。</text>
</svg>
